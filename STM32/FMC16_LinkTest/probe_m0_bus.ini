LOG >D:\CubeMX\STM32_ETH_M0_Demo\FMC16_LinkTest\m0_bus_probe.log

FUNC void ProbeM0Bus(void) {
    int i;
    exec("G");
    _sleep_(1500);
    _break_ = 1;
    _sleep_(100);

    /* PH8/Cloud_EN low: enable the FMC bridge while the CPU is halted. */
    _WDWORD(0x58021C18, 0x01000000);
    _sleep_(10);

    /* Valid 19-word GET_STATUS_SNAPSHOT, sequence=1, tid=0x1234. */
    _WWORD(0x60000000, 0xA55A);
    _WWORD(0x60000000, 0x5AA5);
    _WWORD(0x60000000, 0x100D);
    _WWORD(0x60000000, 0x0013);
    _WWORD(0x60000000, 0x3000);
    _WWORD(0x60000000, 0x0001);
    _WWORD(0x60000000, 0x0002);
    _WWORD(0x60000000, 0x0004);
    _WWORD(0x60000000, 0x0000);
    _WWORD(0x60000000, 0x0001);
    _WWORD(0x60000000, 0x0000);
    _WWORD(0x60000000, 0x1234);
    _WWORD(0x60000000, 0x1144);
    _WWORD(0x60000000, 0x0003);
    _WWORD(0x60000000, 0x0100);
    _WWORD(0x60000000, 0x0000);
    _WWORD(0x60000000, 0x0000);
    _WWORD(0x60000000, 0x7917);
    _WWORD(0x60000000, 0x51BA);
    _sleep_(20);

    printf("M0_BUS_PROBE\n");
    for (i = 0; i < 96; i++) {
        printf("%03d %04X\n", i, _RWORD(0x60000000));
    }

    /* Restore PH8/Cloud_EN high before leaving debug. */
    _WDWORD(0x58021C18, 0x00000100);
    exec("LOG OFF");
    exec("EXIT");
}

ProbeM0Bus()
