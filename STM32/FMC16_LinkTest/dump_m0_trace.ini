LOG >D:\CubeMX\STM32_ETH_M0_Demo\FMC16_LinkTest\m0_trace_dump.log

FUNC void DumpM0Trace(void) {
    int i;
    exec("G");
    _sleep_(20000);
    _break_ = 1;
    _sleep_(100);
    printf("M0_TRACE_COUNTS rx=%u tx=%u attempts=%u successes=%u failures=%u result=%d\n",
           _RDWORD(0x24004D8C), _RDWORD(0x24004D90),
           _RDWORD(0x24018E50), _RDWORD(0x24018E54),
           _RDWORD(0x24018E58), _RDWORD(0x24018E90));
    printf("TX_TRACE\n");
    for (i = 0; i < 32; i++)
        printf("%03d %04X\n", i, _RWORD(0x240190C8 + i * 2));
    printf("RX_TRACE\n");
    for (i = 0; i < 256; i++)
        printf("%03d %04X\n", i, _RWORD(0x24018EC8 + i * 2));
    exec("LOG OFF");
    exec("EXIT");
}

DumpM0Trace()
