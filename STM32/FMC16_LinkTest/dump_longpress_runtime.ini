LOG >D:\CubeMX\tmp\keil_longpress\runtime_dump.log

FUNC void DumpLongpressRuntime(void) {
    exec("G");
    _sleep_(8000);
    _break_ = 1;
    _sleep_(100);
    printf("LONGPRESS_RUNTIME\n");
    printf("eth_started=%u net_ready=%u socket=%d send=%u send_err=%u errno=%d\n",
           eth_task_dbg.started, eth_task_dbg.network_ready,
           eth_task_dbg.last_socket, eth_task_dbg.send_count,
           eth_task_dbg.send_error_count, eth_task_dbg.last_errno);
    printf("fmc_attempt=%u success=%u failure=%u result=%d validity=%04X\n",
           m0_fmc_dbg.read_attempts, m0_fmc_dbg.read_successes,
           m0_fmc_dbg.read_failures, m0_fmc_dbg.last_result,
           m0_fmc_dbg.validity);
    printf("keys_physical=%04X keys_virtual=%04X pi_req=%04X pi_virtual=%04X pi_applied=%04X\n",
           m0_fmc_dbg.key_state, m0_fmc_dbg.virtual_key_state,
           m0_fmc_dbg.pi_requested, m0_fmc_dbg.pi_virtual_toggle,
           m0_fmc_dbg.pi_applied);
    exec("LOG OFF");
    exec("EXIT");
}

DumpLongpressRuntime()
