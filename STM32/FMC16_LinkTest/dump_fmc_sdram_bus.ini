LOG >D:\CubeMX\STM32_ETH_M0_Demo\FMC16_LinkTest\fmc_sdram_bus_dump.log

FUNC void DumpFmcSdramBus(void) {
    exec("G");
    _sleep_(25000);
    _break_ = 1;
    _sleep_(200);
    printf("FMC_SDRAM samples=%u mismatch=%u bit_mask=%04X last_expected=%04X last_actual=%04X last_xor=%04X complete=%u\n",
           _RDWORD(0x24018EA8), _RDWORD(0x24018EAC),
           _RWORD(0x24018EB0), _RWORD(0x24018EB2),
           _RWORD(0x24018EB4), _RWORD(0x24018EB6),
           _RWORD(0x24018EB8));
    printf("GPIOH ODR=%04X IDR=%04X  PH7=%u PH8=%u\n",
           _RWORD(0x58021C14), _RWORD(0x58021C10),
           (_RWORD(0x58021C14) >> 7) & 1,
           (_RWORD(0x58021C14) >> 8) & 1);
    exec("G");
    exec("LOG OFF");
    exec("EXIT");
}

DumpFmcSdramBus()
