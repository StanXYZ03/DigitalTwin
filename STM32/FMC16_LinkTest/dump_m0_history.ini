LOG >D:\CubeMX\STM32_ETH_M0_Demo\FMC16_LinkTest\m0_history_dump.log

FUNC void DumpM0History(void) {
    unsigned long count;
    unsigned long i;

    exec("G");
    _sleep_(18000);
    _break_ = 1;
    _sleep_(100);
    count = _RDWORD(0x24004D98);
    printf("M0_HISTORY count=%u\n", count);
    if (count > 64) count = 64;
    for (i = 0; i < count; i++) {
        printf("%02u ts=%u po=%08X pio=%04X\n", i,
               _RDWORD(0x240192C4 + (i * 4)),
               _RDWORD(0x240191C4 + (i * 4)),
               _RWORD(0x240193C4 + (i * 2)));
    }
    printf("attempt=%u ok=%u fail=%u timeout=%u crc16=%u crc32=%u len=%u current_po=%08X current_pio=%04X\n",
           _RDWORD(0x24018F0C), _RDWORD(0x24018F10),
           _RDWORD(0x24018F14), _RDWORD(0x24018F18),
           _RDWORD(0x24018F1C), _RDWORD(0x24018F20),
           _RDWORD(0x24018F24), _RDWORD(0x24018F48),
           _RWORD(0x24018F5E));
    exec("G");
    exec("LOG OFF");
    exec("EXIT");
}

DumpM0History()
