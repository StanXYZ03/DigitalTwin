LOG >D:\CubeMX\STM32_ETH_M0_Demo\FMC16_LinkTest\m0_value_samples.log

FUNC void SampleM0Values(void) {
    unsigned long old_po;
    unsigned long po;
    unsigned int old_pio;
    unsigned int pio;
    int i;

    exec("G");
    _sleep_(4500);
    old_po = 0xFFFFFFFF;
    old_pio = 0xFFFF;
    printf("M0_VALUE_SAMPLES\n");
    for (i = 0; i < 300; i++) {
        _break_ = 1;
        _sleep_(5);
        po = _RDWORD(0x24018F44);
        pio = _RWORD(0x24018F5A);
        if ((po != old_po) || (pio != old_pio)) {
            printf("i=%d tick=%u attempt=%u ok=%u tid=%08X ts=%u po=%08X pio=%04X valid=%04X result=%d raw=%04X\n",
                   i, _RDWORD(0xE0001004), _RDWORD(0x24018F08),
                   _RDWORD(0x24018F0C), _RDWORD(0x24018F34),
                   _RDWORD(0x24018F40), po, pio,
                   _RWORD(0x24018F58), _RDWORD(0x24018F48),
                   _RWORD(0x24018F4C));
            old_po = po;
            old_pio = pio;
        }
        exec("G");
        _sleep_(20);
    }
    _break_ = 1;
    _sleep_(50);
    printf("FINAL attempts=%u ok=%u fail=%u timeout=%u hdrcrc=%u pktcrc=%u len=%u rx=%u tx=%u ltdc=%u\n",
           _RDWORD(0x24018F08), _RDWORD(0x24018F0C),
           _RDWORD(0x24018F10), _RDWORD(0x24018F14),
           _RDWORD(0x24018F18), _RDWORD(0x24018F1C),
           _RDWORD(0x24018F20), _RDWORD(0x24018F28),
           _RDWORD(0x24018F2C), _RDWORD(0x24018F6C));
    exec("G");
    exec("LOG OFF");
    exec("EXIT");
}

SampleM0Values()
