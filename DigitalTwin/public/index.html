<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>M0 数字孪生</title>
  <style>
    .modes{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.vmode{min-width:62px;padding:10px 14px;border:1px solid #5573a6;border-radius:9px;background:#1b3153;color:#eaf2ff;cursor:pointer;font-weight:700}.vmode:hover{background:#254775}.vmode.active{background:#3e70ba;box-shadow:0 0 12px #3e70ba}.vmode:disabled{opacity:.4;cursor:not-allowed}.matrix{display:grid;grid-template-columns:repeat(16,1fr);gap:3px;width:min(560px,88vw);aspect-ratio:1;margin:18px 0;padding:10px;background:#080b11;border:1px solid #33425c;border-radius:10px}.pixel{border-radius:50%;background:#26171a;box-shadow:inset 0 0 0 1px #4b3438}.pixel.on{background:#ff3e35;box-shadow:0 0 8px #ff3025}.matrix.offline{opacity:.35}
    :root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#eaf2ff;background:#09101e}body{margin:0;min-height:100vh;display:grid;place-items:center}.panel{width:min(920px,92vw);background:#111b2e;border:1px solid #2a3a59;border-radius:18px;padding:28px;box-shadow:0 24px 70px #0008}.head{display:flex;justify-content:space-between;align-items:center}.state{padding:7px 12px;border-radius:99px;background:#3d2530;color:#ff9aaa}.state.fresh{background:#153e33;color:#77edba}.state.stale{background:#4a3d1d;color:#ffd875}.digits{margin:34px 0;display:grid;grid-template-columns:repeat(8,1fr);gap:10px}.digit{font:700 clamp(28px,6vw,58px)/1 ui-monospace,monospace;text-align:center;color:#ff4c43;background:#260f14;padding:18px 4px;border-radius:8px;text-shadow:0 0 14px #ff2419}.leds,.keys,.switches{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px}.io{display:grid;justify-items:center;gap:8px;font-size:12px;color:#91a4c5}.lamp{width:22px;height:22px;border-radius:50%;background:#26324a;box-shadow:inset 0 0 0 2px #43506a}.lamp.on{background:#2df27f;box-shadow:0 0 18px #2df27f}.key{width:40px;height:28px;border-radius:6px;border:1px solid #536480;background:#1a273c}.key.on{background:#4b79c9}.vkey,.vswitch,#buzzerMute,#systemReset,#jtagMaintenance{min-width:88px;padding:12px 16px;border:1px solid #5573a6;border-radius:9px;background:#1b3153;color:#eaf2ff;cursor:pointer;font-weight:700}.vkey:hover,.vswitch:hover,#buzzerMute:hover,#jtagMaintenance:hover{background:#254775}.vkey:active,.vkey.pressed,.vswitch.on{transform:translateY(2px);background:#3e70ba}.vkey:disabled,.vswitch:disabled,#buzzerMute:disabled,#systemReset:disabled,#jtagMaintenance:disabled{opacity:.4;cursor:not-allowed}#systemReset{border-color:#a34b5b;background:#572735;color:#ffdce2}#systemReset:hover:not(:disabled){background:#743244}.control-status{margin-top:12px;color:#91a4c5;font:13px ui-monospace,monospace}.control-status.ok{color:#77edba}.control-status.error{color:#ff9aaa}.environment{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.sensor{background:#16243a;border:1px solid #304566;border-radius:10px;padding:14px}.sensor strong{display:block;font-size:20px;margin:6px 0}.sensor small{color:#91a4c5}.sensor.bad{border-color:#8a4050}.panel-tools{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.meta{margin-top:26px;color:#91a4c5;font:13px ui-monospace,monospace;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}h1{margin:0;font-size:22px}.muted{color:#8192ad}@media(max-width:650px){.environment{grid-template-columns:1fr}}
  </style>
</head>
<body><main class="panel"><div class="head"><div><h1>M0 实验数字孪生</h1><div id="experiment" class="muted">等待真实硬件数据</div></div><span id="state" class="state">离线</span></div><section id="digits" class="digits"></section><h3>PIO LED</h3><section id="leds" class="leds"></section><h3>实体按键状态</h3><section id="keys" class="keys"></section><h3>F1～F10 网页同步按键</h3><section id="virtualKeys" class="keys"></section><div id="controlStatus" class="control-status">等待设备在线</div><h3>环境与供电监测</h3><section class="environment"><div id="sht40" class="sensor"><small>SHT40 温湿度</small><strong>--</strong><span>等待数据</span></div><div id="ina226_u10" class="sensor"><small>过桥板 3.3V 电流</small><strong>--</strong><span>等待数据</span></div><div id="ina226_u44" class="sensor"><small>核心板 5V 电流</small><strong>--</strong><span>等待数据</span></div></section><h3>PCAL6524 拨码与声光报警</h3><section id="switches" class="switches"></section><h4>YDS1～YDS5 实体指示灯</h4><section id="yds" class="leds"></section><div class="panel-tools"><button id="buzzerMute" disabled>蜂鸣器：--</button><span id="alarmLevel">综合报警等级：--</span></div><div id="panelControlStatus" class="control-status">等待面板数据</div><h3>系统控制</h3><div class="panel-tools"><button id="systemReset" disabled>远程复位 STM32</button><button id="jtagMaintenance" disabled>进入 Xilinx JTAG 维护模式</button><span id="resetStatus" class="control-status">等待设备在线</span></div><section class="meta"><span id="seq">sequence: --</span><span id="time">device time: --</span><span id="po">PO: --------</span><span id="pio">PIO: ----</span></section></main>
  <script src="/matrix_state.js"></script>
  <script>
const device='board-001', $=id=>document.getElementById(id);
const digits=$('digits'),leds=$('leds'),keys=$('keys'),virtualKeys=$('virtualKeys'),switches=$('switches'),yds=$('yds');
const modeTitle=document.createElement('h3'),modes=document.createElement('section'),modeHint=document.createElement('div');
modeTitle.textContent='实验模式一键选择';modes.id='modes';modes.className='modes';modeHint.className='control-status';modeHint.textContent='F10 在 M0 计数器与 M11 点阵之间切换；切换时自动配置 BSW。';digits.before(modeTitle,modes,modeHint);
for(const i of [0,11])modes.insertAdjacentHTML('beforeend',`<button class="vmode" data-mode="${i}" disabled>${i===0?'M0 · 计数器':'M11 · 点阵屏'}</button>`);
const matrixTitle=document.createElement('h3'),matrix=document.createElement('section'),matrixStatus=document.createElement('div');
  matrixTitle.textContent='16×16 点阵状态重建';matrix.className='matrix offline';matrixStatus.className='control-status';matrixStatus.textContent='等待 M11 状态简报';digits.before(matrixTitle,matrix,matrixStatus);
for(let i=0;i<256;i++)matrix.insertAdjacentHTML('beforeend','<i class="pixel"></i>');
for(let i=0;i<8;i++)digits.insertAdjacentHTML('beforeend','<div class="digit">0</div>');
for(let i=0;i<12;i++)leds.insertAdjacentHTML('beforeend',`<div class="io"><i class="lamp"></i><span>LED${i}</span></div>`);
for(let i=1;i<=10;i++)keys.insertAdjacentHTML('beforeend',`<div class="io"><i class="key"></i><span>F${i}</span></div>`);
for(let i=1;i<=14;i++)switches.insertAdjacentHTML('beforeend',`<button class="vswitch" data-switch="${i}" ${i===10?'disabled':''}>B${i}${i===10?'<br><small>未连接</small>':''}</button>`);
for(let i=1;i<=5;i++)yds.insertAdjacentHTML('beforeend',`<div class="io"><i class="lamp"></i><span>YDS${i}</span></div>`);
const keyActions={1:'M0:计数速度 / M11:启停',2:'M0:暂停 / M11:图案',3:'M0:清零 / M11:速度',4:'M0:递减 / M11:方向',5:'M0:递增',6:'M0:LED 方向',10:'切换 M0 / M11'};
for(let i=1;i<=10;i++)virtualKeys.insertAdjacentHTML('beforeend',`<button class="vkey" data-key="${i}" disabled>F${i}<br><small>${keyActions[i]||'本实验未使用'}</small></button>`);
let serverSeq=-1;
const locallyHeld=new Set();
let resetInProgress=false,resetStartEpoch=null,lastDeviceEpoch=null;
function renderEnvironment(modules){const t=modules.sht40,u10=modules.ina226_u10,u44=modules.ina226_u44;function show(id,m,value,valid){const el=$(id);el.querySelector('strong').textContent=m&&m.online&&valid?value:'--';el.querySelector('span').textContent=!m?'等待数据':!m.online?'数据超时':valid?'有效':'传感器无效';el.classList.toggle('bad',Boolean(m&&(!m.online||!valid||m.data.level>=2)))}show('sht40',t,t?`${(t.data.temp_dezi/10).toFixed(1)} °C / ${(t.data.rh_dezi/10).toFixed(1)} %RH`:'--',Boolean(t&&t.data.temp_ok));show('ina226_u10',u10,u10?`${u10.data.cur_ma} mA`:'--',Boolean(u10&&u10.data.valid));show('ina226_u44',u44,u44?`${u44.data.cur_ma} mA`:'--',Boolean(u44&&u44.data.valid))}
function renderPanel(s){const m=s.modules&&s.modules.pcal6524;window.lastPanelModule=m;const ready=Boolean(m&&m.online&&m.data.valid);[...switches.children].forEach((e,i)=>{const n=i+1;e.disabled=!ready||n===10;e.classList.toggle('on',Boolean(ready&&(m.data.sw&(1<<i))))});[...yds.querySelectorAll('.lamp')].forEach((e,i)=>e.classList.toggle('on',Boolean(ready&&(m.data.yds&(1<<i)))));$('buzzerMute').disabled=!ready;$('buzzerMute').textContent=ready?`蜂鸣器：${m.data.buzzer_mute?'已静音':'自动报警'}`:'蜂鸣器：--';$('alarmLevel').textContent=ready?`综合报警等级：${['正常','预警','告警','紧急'][m.data.alarm_level]}`:'综合报警等级：--';if(s.panelControl){const c=s.panelControl,el=$('panelControlStatus');el.className='control-status '+(c.status==='acknowledged'?'ok':c.status==='failed'?'error':'');el.textContent=c.status==='pending'?`面板命令正在下发（第 ${c.attempts} 次）`:c.status==='acknowledged'?`面板命令 ${c.commandId} 已执行`:c.status==='failed'?'面板命令下发失败':'面板可以操作'}}
function renderMatrix(s){const inM11=s.mode===11;matrixTitle.style.display=inM11?'block':'none';matrix.style.display=inM11?'grid':'none';matrixStatus.style.display=inM11?'block':'none';if(!inM11)return;const state=MatrixState.decodeM11(s.po);const valid=state.valid&&s.freshness!=='offline';matrix.classList.toggle('offline',!valid);matrixStatus.className='control-status '+(valid?'ok':'error');if(!valid){matrixStatus.textContent=state.valid?'M11 状态简报已离线':'PO 中没有有效的 D4 状态简报';return}const rows=MatrixState.renderPattern(state);for(let y=0;y<MatrixState.SIZE;y++){for(let x=0;x<MatrixState.SIZE;x++)matrix.children[y*MatrixState.SIZE+x].classList.toggle('on',Boolean(rows[y]&(1<<x)))}const health=s.freshness==='fresh'?`在线 · scan ${state.scanHeartbeat.toString(16).toUpperCase()}`:'遥测延迟';matrixStatus.textContent=`${health} · ${state.running?'运行':'暂停'} · ${MatrixState.PATTERN_NAMES[state.patternMode]} · ${MatrixState.SPEED_NAMES[state.speed]} · ${state.direction?'反向':'正向'} · 帧 ${state.framePos}`}
function render(s){if(!s||s.serverSeq<serverSeq)return;serverSeq=s.serverSeq;const maintenance=s.systemState==='jtag-maintenance';$('experiment').textContent=s.experiment;$('state').textContent=maintenance?'JTAG维护中':s.freshness==='fresh'?'在线':s.freshness==='stale'?'数据延迟':'离线';$('state').className='state '+s.freshness;if(resetInProgress&&resetStartEpoch!==null&&s.deviceEpoch>resetStartEpoch&&s.freshness==='fresh'&&!maintenance){resetInProgress=false;$('resetStatus').className='control-status ok';$('resetStatus').textContent='STM32 已复位并恢复在线'}lastDeviceEpoch=s.deviceEpoch;$('systemReset').disabled=s.freshness==='offline'||resetInProgress||maintenance;[...digits.children].forEach((e,i)=>e.textContent=s.display.digits[i]);[...leds.querySelectorAll('.lamp')].forEach((e,i)=>e.classList.toggle('on',s.display.leds[i]));[...keys.querySelectorAll('.key')].forEach((e,i)=>e.classList.toggle('on',Boolean(s.physicalKeys&&s.physicalKeys[i])));[...virtualKeys.children].forEach((e,i)=>{e.disabled=s.freshness==='offline'||maintenance;e.classList.toggle('pressed',Boolean(locallyHeld.has(i+1)||(s.physicalKeys&&s.physicalKeys[i])||(s.virtualKeys&&s.virtualKeys[i])));e.title=`实体:${s.physicalKeys&&s.physicalKeys[i]?'按下':'松开'} / 网页:${s.virtualKeys&&s.virtualKeys[i]?'按下':'松开'} / XOR:${s.keys&&s.keys[i]?'1':'0'}`});$('seq').textContent='sequence: '+s.sequence;$('time').textContent='device time: '+s.timestamp_ms+' ms';$('po').textContent='PO: 0x'+s.display.digits.join('');$('pio').textContent='PIO: 0x'+s.pio.toString(16).toUpperCase().padStart(4,'0');if(s.control){const c=s.control,el=$('controlStatus');el.className='control-status '+(c.status==='acknowledged'?'ok':c.status==='failed'?'error':'');const a=c.action==='down'?'按下':'松开';el.textContent=maintenance?'维护模式下普通控制已暂停':c.status==='pending'?`F${c.key} ${a}正在下发（第 ${c.attempts} 次）`:c.status==='acknowledged'?`F${c.key} ${a}已执行，命令 ${c.commandId}`:c.status==='failed'?`F${c.key} ${a}下发失败，请检查网络`:'可以操作'}renderEnvironment(s.modules||{});renderPanel(s)}
async function setKey(key,action){try{const r=await fetch(`/api/digital-twin/devices/${device}/keys/F${key}/${action}`,{method:'POST',keepalive:action==='up'});const v=await r.json();if(!r.ok)throw new Error(v.error||r.status);$('controlStatus').textContent=`F${key} ${action==='down'?'按下':'松开'}已排队，命令 ${v.commandId}`;}catch(e){$('controlStatus').className='control-status error';$('controlStatus').textContent='下发失败：'+e.message;}}
function down(button,event){if(button.disabled)return;event.preventDefault();const key=Number(button.dataset.key);if(locallyHeld.has(key))return;locallyHeld.add(key);button.setPointerCapture?.(event.pointerId);button.classList.add('pressed');setKey(key,'down');}
function up(button,event){const key=Number(button.dataset.key);if(!locallyHeld.delete(key))return;event?.preventDefault();button.classList.remove('pressed');setKey(key,'up');}
[...virtualKeys.children].forEach(button=>{button.addEventListener('pointerdown',e=>down(button,e));button.addEventListener('pointerup',e=>up(button,e));button.addEventListener('pointercancel',e=>up(button,e));button.addEventListener('lostpointercapture',e=>up(button,e));button.addEventListener('contextmenu',e=>e.preventDefault())});
async function setPanel(path){try{const r=await fetch(`/api/digital-twin/devices/${device}/${path}`,{method:'POST'});const v=await r.json();if(!r.ok)throw new Error(v.error||r.status);$('panelControlStatus').textContent=`面板命令已排队，命令 ${v.commandId}`;}catch(e){$('panelControlStatus').className='control-status error';$('panelControlStatus').textContent='面板下发失败：'+e.message;}}
[...modes.children].forEach(button=>button.addEventListener('click',()=>setPanel(`modes/M${button.dataset.mode}`)));
[...switches.children].forEach(button=>button.addEventListener('click',()=>{const n=Number(button.dataset.switch);setPanel(`switches/B${n}/${button.classList.contains('on')?'off':'on'}`)}));
$('buzzerMute').addEventListener('click',()=>{const m=window.lastPanelModule;setPanel(`buzzer/${m&&m.data.buzzer_mute?'unmute':'mute'}`)});
$('systemReset').addEventListener('click',async()=>{if(!confirm('确定要远程复位 STM32 吗？设备会短暂离线并自动恢复。'))return;const b=$('systemReset'),el=$('resetStatus');resetInProgress=true;resetStartEpoch=lastDeviceEpoch;b.disabled=true;el.className='control-status';el.textContent='复位命令正在下发…';try{const r=await fetch(`/api/digital-twin/devices/${device}/system/reset`,{method:'POST'});const v=await r.json();if(!r.ok)throw new Error(v.error||r.status);el.className='control-status ok';el.textContent=`复位命令 ${v.commandId} 已排队，等待设备重启`;}catch(e){resetInProgress=false;el.className='control-status error';el.textContent='复位失败：'+e.message;b.disabled=false;}});
$('jtagMaintenance').addEventListener('click',async()=>{const maintenance=$('jtagMaintenance').dataset.maintenance==='1';const prompt=maintenance?'确认 Xilinx JTAG 配置已经完成，并退出维护模式吗？STM32 将重启，但会保留当前 FPGA SRAM 配置。':'确定进入 Xilinx JTAG 维护模式吗？LCD、FMC 和普通控制会暂停，以太网将继续用于退出维护。';if(!confirm(prompt))return;const b=$('jtagMaintenance'),el=$('resetStatus');b.disabled=true;el.className='control-status';el.textContent=maintenance?'正在退出维护并恢复系统…':'正在进入 JTAG 维护模式…';try{const suffix=maintenance?'/exit':'';const r=await fetch(`/api/digital-twin/devices/${device}/system/jtag-maintenance${suffix}`,{method:'POST'});const v=await r.json();if(!r.ok)throw new Error(v.error||r.status);el.className='control-status ok';el.textContent=maintenance?`退出命令 ${v.commandId} 已排队，等待正常遥测恢复`:`维护命令 ${v.commandId} 已排队，等待维护心跳`;}catch(e){el.className='control-status error';el.textContent=(maintenance?'退出':'进入')+'维护模式失败：'+e.message;b.disabled=false;}});
const renderBase=render;render=function(s){renderBase(s);if(!s)return;const maintenance=s.systemState==='jtag-maintenance';const jtagPending=Boolean(s.panelControl&&s.panelControl.target==='jtag'&&s.panelControl.status==='pending');const b=$('jtagMaintenance');b.dataset.maintenance=maintenance?'1':'0';b.textContent=maintenance?'退出维护并恢复系统':'进入 Xilinx JTAG 维护模式';b.disabled=s.freshness==='offline'||resetInProgress||jtagPending;if(maintenance){$('experiment').textContent=`Xilinx JTAG 维护模式 · FPGA DONE=${s.maintenance&&s.maintenance.fpga_done?'1':'0'}`;$('resetStatus').className='control-status ok';$('resetStatus').textContent=jtagPending?'退出维护命令正在下发…':'JTAG 已释放，可用 Vivado 3 MHz 下载；完成后点击“退出维护并恢复系统”'}else{$('experiment').textContent=s.experiment+` · 当前 M${s.mode}`}[...modes.children].forEach(e=>{e.disabled=s.freshness==='offline'||maintenance;e.classList.toggle('active',!maintenance&&Number(e.dataset.mode)===s.mode)});if(maintenance){[...switches.children].forEach(e=>e.disabled=true);$('buzzerMute').disabled=true;matrixTitle.style.display='none';matrix.style.display='none';matrixStatus.style.display='none'}else renderMatrix(s)};
window.addEventListener('blur',()=>[...locallyHeld].forEach(key=>{locallyHeld.delete(key);setKey(key,'up')}));
async function initial(){try{const r=await fetch(`/api/digital-twin/devices/${device}/snapshot`,{cache:'no-store'});if(r.ok)render(await r.json())}catch(_){}}
function connect(){const proto=location.protocol==='https:'?'wss':'ws';const ws=new WebSocket(`${proto}://${location.host}/ws/digital-twin/devices/${device}`);ws.onopen=()=>{serverSeq=-1;initial()};ws.onmessage=e=>render(JSON.parse(e.data));ws.onclose=()=>setTimeout(connect,1000)}initial().finally(connect);
</script></body></html>
