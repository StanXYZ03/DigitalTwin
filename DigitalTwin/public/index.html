<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>M0 数字孪生</title>
  <style>
    :root{font-family:Inter,"Microsoft YaHei",sans-serif;color:#eaf2ff;background:#09101e}body{margin:0;min-height:100vh;display:grid;place-items:center}.panel{width:min(920px,92vw);background:#111b2e;border:1px solid #2a3a59;border-radius:18px;padding:28px;box-shadow:0 24px 70px #0008}.head{display:flex;justify-content:space-between;align-items:center}.state{padding:7px 12px;border-radius:99px;background:#3d2530;color:#ff9aaa}.state.fresh{background:#153e33;color:#77edba}.state.stale{background:#4a3d1d;color:#ffd875}.digits{margin:34px 0;display:grid;grid-template-columns:repeat(8,1fr);gap:10px}.digit{font:700 clamp(28px,6vw,58px)/1 ui-monospace,monospace;text-align:center;color:#ff4c43;background:#260f14;padding:18px 4px;border-radius:8px;text-shadow:0 0 14px #ff2419}.leds,.keys{display:flex;flex-wrap:wrap;gap:16px;margin-top:18px}.io{display:grid;justify-items:center;gap:8px;font-size:12px;color:#91a4c5}.lamp{width:22px;height:22px;border-radius:50%;background:#26324a;box-shadow:inset 0 0 0 2px #43506a}.lamp.on{background:#2df27f;box-shadow:0 0 18px #2df27f}.key{width:40px;height:28px;border-radius:6px;border:1px solid #536480;background:#1a273c}.key.on{background:#4b79c9}.vkey{min-width:88px;padding:12px 16px;border:1px solid #5573a6;border-radius:9px;background:#1b3153;color:#eaf2ff;cursor:pointer;font-weight:700}.vkey:hover{background:#254775}.vkey:active,.vkey.pressed{transform:translateY(2px);background:#3e70ba}.vkey:disabled{opacity:.4;cursor:not-allowed}.control-status{margin-top:12px;color:#91a4c5;font:13px ui-monospace,monospace}.control-status.ok{color:#77edba}.control-status.error{color:#ff9aaa}.meta{margin-top:26px;color:#91a4c5;font:13px ui-monospace,monospace;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}h1{margin:0;font-size:22px}.muted{color:#8192ad}
  </style>
</head>
<body><main class="panel"><div class="head"><div><h1>M0 实验数字孪生</h1><div id="experiment" class="muted">等待真实硬件数据</div></div><span id="state" class="state">离线</span></div><section id="digits" class="digits"></section><h3>PIO LED</h3><section id="leds" class="leds"></section><h3>实体按键状态</h3><section id="keys" class="keys"></section><h3>F1～F10 网页同步按键</h3><section id="virtualKeys" class="keys"></section><div id="controlStatus" class="control-status">等待设备在线</div><section class="meta"><span id="seq">sequence: --</span><span id="time">device time: --</span><span id="po">PO: --------</span><span id="pio">PIO: ----</span></section></main>
<script>
const device='board-001', $=id=>document.getElementById(id);
const digits=$('digits'),leds=$('leds'),keys=$('keys'),virtualKeys=$('virtualKeys');
for(let i=0;i<8;i++)digits.insertAdjacentHTML('beforeend','<div class="digit">0</div>');
for(let i=0;i<12;i++)leds.insertAdjacentHTML('beforeend',`<div class="io"><i class="lamp"></i><span>LED${i}</span></div>`);
for(let i=1;i<=10;i++)keys.insertAdjacentHTML('beforeend',`<div class="io"><i class="key"></i><span>F${i}</span></div>`);
const keyActions={1:'计数速度',2:'暂停 / 继续',3:'清零',4:'递减',5:'递增',6:'LED 方向'};
for(let i=1;i<=10;i++)virtualKeys.insertAdjacentHTML('beforeend',`<button class="vkey" data-key="${i}" disabled>F${i}<br><small>${keyActions[i]||'本实验未使用'}</small></button>`);
let serverSeq=-1;
const locallyHeld=new Set();
function render(s){if(!s||s.serverSeq<serverSeq)return;serverSeq=s.serverSeq;$('experiment').textContent=s.experiment;$('state').textContent=s.freshness==='fresh'?'在线':s.freshness==='stale'?'数据延迟':'离线';$('state').className='state '+s.freshness;[...digits.children].forEach((e,i)=>e.textContent=s.display.digits[i]);[...leds.querySelectorAll('.lamp')].forEach((e,i)=>e.classList.toggle('on',s.display.leds[i]));[...keys.querySelectorAll('.key')].forEach((e,i)=>e.classList.toggle('on',Boolean(s.physicalKeys&&s.physicalKeys[i])));[...virtualKeys.children].forEach((e,i)=>{e.disabled=s.freshness==='offline';e.classList.toggle('pressed',Boolean(locallyHeld.has(i+1)||(s.physicalKeys&&s.physicalKeys[i])||(s.virtualKeys&&s.virtualKeys[i])));e.title=`实体:${s.physicalKeys&&s.physicalKeys[i]?'按下':'松开'} / 网页:${s.virtualKeys&&s.virtualKeys[i]?'按下':'松开'} / XOR:${s.keys&&s.keys[i]?'1':'0'}`});$('seq').textContent='sequence: '+s.sequence;$('time').textContent='device time: '+s.timestamp_ms+' ms';$('po').textContent='PO: 0x'+s.display.digits.join('');$('pio').textContent='PIO: 0x'+s.pio.toString(16).toUpperCase().padStart(4,'0');if(s.control){const c=s.control,el=$('controlStatus');el.className='control-status '+(c.status==='acknowledged'?'ok':c.status==='failed'?'error':'');const a=c.action==='down'?'按下':'松开';el.textContent=c.status==='pending'?`F${c.key} ${a}正在下发（第 ${c.attempts} 次）`:c.status==='acknowledged'?`F${c.key} ${a}已执行，命令 ${c.commandId}`:c.status==='failed'?`F${c.key} ${a}下发失败，请检查网络`:'可以操作'}}
async function setKey(key,action){try{const r=await fetch(`/api/digital-twin/devices/${device}/keys/F${key}/${action}`,{method:'POST',keepalive:action==='up'});const v=await r.json();if(!r.ok)throw new Error(v.error||r.status);$('controlStatus').textContent=`F${key} ${action==='down'?'按下':'松开'}已排队，命令 ${v.commandId}`;}catch(e){$('controlStatus').className='control-status error';$('controlStatus').textContent='下发失败：'+e.message;}}
function down(button,event){if(button.disabled)return;event.preventDefault();const key=Number(button.dataset.key);if(locallyHeld.has(key))return;locallyHeld.add(key);button.setPointerCapture?.(event.pointerId);button.classList.add('pressed');setKey(key,'down');}
function up(button,event){const key=Number(button.dataset.key);if(!locallyHeld.delete(key))return;event?.preventDefault();button.classList.remove('pressed');setKey(key,'up');}
[...virtualKeys.children].forEach(button=>{button.addEventListener('pointerdown',e=>down(button,e));button.addEventListener('pointerup',e=>up(button,e));button.addEventListener('pointercancel',e=>up(button,e));button.addEventListener('lostpointercapture',e=>up(button,e));button.addEventListener('contextmenu',e=>e.preventDefault())});
window.addEventListener('blur',()=>[...locallyHeld].forEach(key=>{locallyHeld.delete(key);setKey(key,'up')}));
async function initial(){try{const r=await fetch(`/api/digital-twin/devices/${device}/snapshot`,{cache:'no-store'});if(r.ok)render(await r.json())}catch(_){}}
function connect(){const proto=location.protocol==='https:'?'wss':'ws';const ws=new WebSocket(`${proto}://${location.host}/ws/digital-twin/devices/${device}`);ws.onmessage=e=>render(JSON.parse(e.data));ws.onclose=()=>setTimeout(connect,1000)}initial().finally(connect);
</script></body></html>
